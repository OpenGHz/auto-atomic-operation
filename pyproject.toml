[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-atomic-operation"
version = "0.3.3"
description = "A YAML-driven atomic operation framework for robotic manipulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenGHz" }]
dependencies = [
  "hydra-core",
  "hydra-joblib-launcher>=1.2",
  "numpy",
  "scipy",
  "pydantic>=2",
  "pydantic-settings>=2",
]
urls = { "repository" = "https://github.com/OpenGHz/auto-atomic-operation.git" }

[project.scripts]
aao-demo = "auto_atom.runner.demo:main"
aao-eval = "auto_atom.runner.policy_eval:main"
aao-info = "auto_atom.runner.task_info:main"
aao-unidoor-sweep = "auto_atom.runner.unidoor_sweep:main"

[project.optional-dependencies]
mujoco = ["mujoco >=3.12.0,<3.13.0", "PyOpenGL_accelerate"]
# GPU MuJoCo. mujoco-warp requires mujoco>=3.12.0, so it composes with the
# `mujoco` pin above rather than forcing it forward. Imported lazily by
# auto_atom.basis.mjwarp, so the native path never needs this installed.
mjwarp = ["mujoco-warp >=3.13.0", "warp-lang >=1.15"]
gs = [
  "gsplat",
  "torch",
  "plyfile",
  "natsort",
  "einops",
  "e3nn",
  "gaussian_renderer @ git+https://github.com/OpenGHz/GaussianRenderer.git",
]

[tool.setuptools.packages.find]
include = ["auto_atom*"]
# Prune heavy non-package dirs from the walk. With namespaces=true every dir
# looks like a package, so setuptools would otherwise recurse into data/ (900M+),
# assets/, third_party/ etc. and hang during editable builds. The early-prune
# only fires on the exact literal "<name>*" pattern, so list each top-level dir.
exclude = [
  "data*",
  "assets*",
  "outputs*",
  "third_party*",
  "tests*",
  "examples*",
  "docs*",
  "dist*",
  "aao_configs*",
]
namespaces = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
pip = "*"

# The Python pin lives in features so the `gs` environment can use 3.10.
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
auto-atomic-operation = { path = ".", editable = true, extras = ["mujoco"] }
pytest = "*"
# Imported by IPC, replay, and viewer camera-overlay code paths and their tests.
# The heavy GPU extras are not part of this env; Gaussian splatting lives in
# the separate `gs` environment below.
rpyc = "*"
imageio = "*"
opencv-python = "*"
# Asset-migration inspection: mesh bounds/hulls and offscreen render snapshots.
trimesh = "*"
pillow = "*"

[tool.pixi.tasks]
test = "python scripts/run_tests_safe.py"

# Gaussian-splatting environment: `pixi run -e gs ...`.
# gsplat only publishes prebuilt CUDA wheels for CPython 3.10 and torch <= 2.4;
# the generic PyPI wheel JIT-compiles its kernels and would need a full CUDA
# toolkit (nvcc) inside the env. Pin the prebuilt torch 2.4 / CUDA 12.4 pair
# instead; it runs on any driver that supports CUDA >= 12.4.
[tool.pixi.feature.gs.dependencies]
python = "3.10.*"
# gaussian_renderer uses torch.compile; Triton builds its CUDA driver shim and
# kernels with a host C compiler at runtime.
c-compiler = "*"

[tool.pixi.feature.gs.pypi-dependencies]
auto-atomic-operation = { path = ".", editable = true, extras = ["mujoco", "gs"] }
torch = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu124" }
gsplat = { url = "https://github.com/nerfstudio-project/gsplat/releases/download/v1.5.3/gsplat-1.5.3%2Bpt24cu124-cp310-cp310-linux_x86_64.whl" }
# GS scripts under examples/ plot with matplotlib.
matplotlib = "*"
# Provides `hf` for the gs-assets task.
huggingface_hub = "*"

[tool.pixi.feature.gs.tasks]
# Gaussian scene assets live on Hugging Face (gitignored under assets/gs/).
# Set HF_ENDPOINT to use a mirror when huggingface.co is unreachable.
gs-assets = "hf download OpenGHz/auto-atom-assets --repo-type=dataset --include 'assets/gs/*' --local-dir ."

[tool.pixi.environments]
default = ["py312"]
gs = ["gs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party"]
