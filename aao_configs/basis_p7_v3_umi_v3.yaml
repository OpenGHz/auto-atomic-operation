defaults:
  - basis_xf9600
  - _self_

env:
  # Inject the P7 arm v3 + UMI gripper v3 into the composable scene.
  scene:
    layers:
      - kind: mjcf
        path: ${assets_dir}/xmls/robots/p7_arm_v3_with_umi_gripper_v3.xml
  # Forward-reach home pose. Values mirror basis_p7_xf9600 — even though the
  # v3 arm has slightly different DH, the resulting TCP lands near typical
  # tabletop / door grasp targets and away from singularities.
  initial_joint_positions:
    joint1:  0.0016582
    joint2: -0.305293
    joint3: -0.00983217
    joint4:  0.166931
    joint5:  1.59943
    joint6: -0.107997
    joint7: -0.00103546
    # UMI gripper v3 driven slide (range 0..0.0165; lower bound = max open)
    eef_claw_joint: 0.0
  operators:
    arm:
      arm_actuators:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        - joint7
      eef_actuators: [eef_claw_joint]
      eef_output_name: gripper
      eef_mapper:
        _target_: auto_atom.mappers.finger_distance.FingerDistanceMapper
        left_pad_geom: eef_left_finger_collision
        right_pad_geom: eef_right_finger_collision
        actuator_name: eef_claw_joint
      pose_site: eef_pose
      root_body: p7_mount
      ik_factory: auto_atom.backend.mjc.ik.p7_v3_analytical_ik_solver.P7V3AnalyticalIKSolver
      ik_params:
        flange_site_name: tool_site
        tcp_site_name: eef_pose

backend: auto_atom.backend.mjc.ik.p7_v3_analytical_ik_solver.build_p7_v3_umi_v3_backend
