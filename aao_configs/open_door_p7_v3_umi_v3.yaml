defaults:
  - basis_p7_v3_umi_v3
  - _self_

scene_name: open_door
task_name: open_door_p7_v3_umi_v3

env:
  # Keep the inherited eef_wrist_cam (umi_gripper_v3 now defines a
  # ``wrist_cam`` body in base_link) and add the scene's env2_cam.
  cameras:
    - name: eef_wrist_cam
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      parent_frame: eef_pose
      is_static: false
    - name: env2_cam
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      is_static: true
  sim_freq: 1000
  update_freq: 100
  mask_objects: [ "handle_lever_body" ]
  operations: [ "push" ]
  pre_step_callbacks:
    - _target_: auto_atom.callbacks.door_latch.DoorLatchCallback
      config:
        _target_: auto_atom.callbacks.door_latch.DoorLatchConfig
        lock_constraint: door_latch_lock
        door_joint: door_hinge
        handle_joint: handle_hinge
        handle_direction: 1
        unlock_travel: 0.12
        relock_travel: 0.08
        relock_zone: 0.02
  viewer:
    lookat: [ 1.25, 0.15, -0.2 ]
    distance: 1.8
    azimuth: 30
    elevation: -15
    step_delay: 0.005
    hold_seconds: 0.5

task:
  stages:
    - name: grasp_and_open
      object: handle_body_phys
      operation: push
      operator: arm
      param:
        pre_move:
          # 1. Approach: ~14cm in front of handle (relative to handle_body_phys)
          - position: [ -0.14, 0.0955, -0.015 ]
            reference: object_world
            orientation: [ 0.68997457, 0.19902274, -0.20541703, 0.66492774 ]
            max_linear_step: 0.04
            max_angular_step: 0.25
          # 2. Grasp position: ~7cm in front of handle
          - position: [ -0.07, 0.1155, -0.015 ]
            reference: object_world
            orientation: [ 0.68997457, 0.19902274, -0.20541703, 0.66492774 ]
            max_linear_step: 0.04
            max_angular_step: 0.2
        eef:
          close: true
        post_move:
          # 3. Rotate handle to unlock (arc around handle_hinge)
          - arc:
              pivot: handle_hinge
              axis: [ -1, 0, 0 ]
              angle: 0.45
              absolute: true
              max_step: 0.15
            reference: world
          # 4. Push door open (arc around door_hinge). Angle kept modest
          # because the v3 arm reaches its workspace limit before the door
          # rotates much further (the door radius is ~0.7m, beyond the
          # arm's effective reach once the handle has been pulled past
          # ~15°).
          - arc:
              pivot: door_hinge
              axis: [ 0, 0, 1 ]
              angle: 0.20
              absolute: true
              max_step: 0.15
            reference: world

task_operators:
  arm:
    control:
      cartesian_max_linear_step: 0.025
      cartesian_max_angular_step: 0.3
      tolerance:
        position: 0.008
        orientation: 0.10
        eef: 0.012
    max_joint_delta: 0.35
    ik:
      joint_control_mode: per_step_ik
