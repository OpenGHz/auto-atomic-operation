defaults:
  - basis_mocap_eef_umi_v3
  - _self_

scene_name: pick_and_place

env:
  # umi_gripper_v3 has stiff parallel-linkage equality constraints, similar
  # to xf9600. Step at 1200 Hz (0.833 ms) to keep the constraints stable
  # while the gripper closes.
  sim_freq: 1200
  mask_objects: ["source_block", "target_pedestal"]
  operations: ["pick", "place"]
  viewer:
    lookat: [0.04, 0.0, 0.1]
    distance: 0.55
    azimuth: 135
    elevation: -28
    step_delay: 0.03
    hold_seconds: 1.0

task_operators:
  arm:
    control:
      # The mocap weld is slightly compliant; once the gripper picks up
      # the source_block its position lags the mocap target by ~1 cm.
      # Loosen the position tolerance from the 0.008 default so the
      # post-pick lift / place pose-reach checks accept that sag.
      tolerance:
        position: 0.015
        orientation: 0.10

task:
  randomization:
    entities:
      source_block:
        x: [-0.03, 0.03]
        y: [-0.03, 0.03]
        collision_radius: 0.04
  stages:
    - name: pick_source
      object: source_block
      operation: pick
      operator: arm
      param:
        pre_move:
          - position: [0.0, 0.0, 0.08]
            # Top-down grasp: x_eef of umi_gripper_v3's eef_pose rests along
            # the gripper's +x approach axis (identity orientation in
            # base_link). The world target ``[0.707, 0, -0.707, 0]`` (xyzw,
            # 180° around (1,0,-1)/√2) puts x_eef = -z_world (approach
            # down).
            orientation: [0.70710678, 0.0, -0.70710678, 0.0]
            reference: object_world
          # The mocap eef_pose sits at base_link + 0.1486 (matching the
          # arm version's tcp_frame + eef_pose offset of 0.1601 − 0.0115).
          # At top-down approach this puts the open finger pads ~6.70 cm
          # "above" the eef target in world z, the closed pads ~2.68 cm
          # "above", and the block-side-contact pads (mid-close,
          # pad_dist≈0.036) ~3.16 cm "above". To grip the block centrally,
          # place the eef ~2.7 cm below the object centre so:
          #   - open pads (eef + 6.70 cm) clear the block top by 4 cm,
          #   - mid-close pads (eef + 3.16 cm) land just above centre,
          #   - closed pads (eef + 2.68 cm) settle at the block centre.
          - position: [0.0, 0.0, -0.027]
            reference: object_world
        post_move:
          - position: [0.0, 0.0, 0.2]
            reference: eef_world
        eef:
          close: true
    - name: place_source
      object: target_pedestal
      operation: place
      operator: arm
      param:
        pre_move:
          - position: [0.0, 0.0, 0.15]
            reference: object_world
          # Pedestal top at z=0.14 (half-height 0.04, centre 0.10). Block
          # half-height 0.018. With closed pads at eef + 2.68 cm and the
          # block held centred on the pads, block_bottom = eef + 2.68 cm
          # − 1.8 cm = eef + 0.88 cm. To land the block on the pedestal
          # (block_bottom ≈ 0.14), the eef sits at z ≈ 0.131, i.e. +3.1
          # cm above the pedestal centre.
          - position: [0.0, 0.0, 0.031]
            reference: object_world
        post_move:
          - position: [0.0, 0.0, 0.18]
            reference: object_world
        eef:
          close: false
