# MJWarp (GPU MuJoCo) backend overlay.
#
# Add this to a task config's ``defaults`` to run it on the MJWarp backend
# instead of CPU MuJoCo, without editing the task config itself:
#
#   defaults:
#     - <your_task_config>
#     - mjwarp_mixin
#     - _self_
#
# It overrides only the two fields that select the simulator -- the environment
# Hydra instantiates (``env._target_``) and the backend builder the runtime
# calls (``backend``) -- plus ``env.njmax``, which physical scenes need.
#
# Everything else (scene layers, cameras, sensors, operators, randomization)
# comes from the task config unchanged, because the MJWarp env and backend read
# the same EnvConfig / task config the CPU path does.

env:
  _target_: auto_atom.basis.mjwarp.env.MjWarpObjectOnlyEnv
  # MJWarp preallocates a constraint buffer; physical scenes overflow the
  # default budget on the first step (``nefc overflow``). 512 clears the
  # rack_plate arm; raise it for scenes with more contacts or more worlds.
  # object_only execution has no operator contacts and does not need it, but
  # setting it is harmless there.
  njmax: 512
  # The MJWarp env has no interactive passive viewer; keep it unset.
  viewer: null

backend: auto_atom.backend.mjwarp.backend.build_mjwarp_backend
