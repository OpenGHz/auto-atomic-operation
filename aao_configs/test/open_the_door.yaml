# @package _global_
#
# Scratch override for GS benchmarks: color-only 640x480 wrist + door cameras.
#     ... task=open_door_back render=gs +test=open_the_door

observation:
  camera:
    width: 640
    height: 480
    enable_color: true
    enable_depth: false
    enable_mask: false
    enable_heat_map: false

env:
  batch_size: 5
  warmup: true
  to_numpy: true
  structured: false
  enabled_sensors:
    - camera
  cameras:
    env1: null
    env0: null
    env2:
      name: env2_cam
      is_static: true
