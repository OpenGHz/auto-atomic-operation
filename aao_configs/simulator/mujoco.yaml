# @package _global_
#
# MuJoCo environment shell shared by every simulated task. Scene, embodiment
# and task configs fill in the remaining fields.

model_name: demo
task_name: ${scene_name}
# Embodiments validated for top-down tabletop grasps define
# `eef_top_down_orientation` (xyzw, world frame) and tasks reference it as
# ${eef_top_down_orientation}. It is intentionally not defaulted here:
# composing such a task on an embodiment without one fails with
# "Interpolation key 'eef_top_down_orientation' not found".

env:
  _target_: auto_atom.basis.mjc.mujoco_env.BatchedUnifiedMujocoEnv
  name: ${task_name}
  scene:
    base: ${assets_dir}/xmls/scenes/${scene_name}/${model_name}.xml
    # Ordered scene composition layers, keyed by a slot name so later configs
    # can replace (or remove with `null`) one layer without restating the
    # list. Scene asset layers precede the embodiment's `robot` layer because
    # the scene group composes first.
    layers: {}
  batch_size: 2
  enabled_sensors: ${observation.sensors}
  sim_freq: 600
  update_freq: 30
  # World gravity vector (m/s^2) overriding the scene's <option gravity>,
  # e.g. [0, 0, 0] to disable gravity. null keeps the XML value.
  gravity: null
  # Remove configured operator body subtrees from native MuJoCo RGB/depth/
  # segmentation rendering without changing physics or the passive viewer.
  hide_operators_in_camera: false
  # Cameras are keyed by slot. Every entry inherits `camera_defaults`
  # (resolution and modalities from the observation group) and is dropped
  # when its role is not in `camera_roles` (camera_layout group). Set a slot
  # to `null` to remove an inherited camera.
  camera_defaults: ${observation.camera}
  camera_roles: ${camera_layout.roles}
  cameras:
    # The embodiment names the wrist camera; scenes add their static cameras.
    wrist:
      role: operator
      parent_frame: eef_pose
      is_static: false
  heatmap_operations: ["pick", "place", "push", "pull", "press"]

backend: auto_atom.backend.mjc.mujoco_backend.build_mujoco_backend

task:
  env_name: ${task_name}
  seed: 42
