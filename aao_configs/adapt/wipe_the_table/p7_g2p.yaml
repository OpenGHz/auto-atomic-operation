# @package _global_
task_name: airbot_p7_wipe_the_table_gs

task:
  randomization:
    entities:
      arm:
        eef:
          x: [-0.0, 0.0]
          y: [-0.0, 0.0]
          z: [-0.0, 0.0]
      blue_duck:
        x: [0.56, 0.64]
        y: [0.1, 0.2]
        collision_radius: 0.04
        reference: absolute_world

  stages:
    - name: pick_blue_duck
      object: blue_duck
      operation: pick
      operator: arm
      param:
        pre_move:
          - position: [0.0, 0.0, 0.14]
            orientation: ${eef_top_down_orientation}
            reference: object_world
            max_linear_step: 0.04
            max_angular_step: 0.35
          - position: [0.0, 0.0, 0.001]
            orientation: ${eef_top_down_orientation}
            reference: object_world
            max_linear_step: 0.02
            max_angular_step: 0.2
        eef:
          close: true
        post_move:
          - position: [0.0, 0.0, 0.22]
            orientation: ${eef_top_down_orientation}
            reference: eef_world
            max_linear_step: 0.02
            max_angular_step: 0.2

    - name: place_blue_duck_in_box
      object: white_box
      operation: place
      operator: arm
      param:
        pre_move:
          - position: [0.0, 0.08, 0.22]
            orientation: ${eef_top_down_orientation}
            reference: object_world
            max_linear_step: 0.05
            max_angular_step: 0.25
            tolerance:
              position: 0.045
              orientation: 0.4
          - position: [0.0, 0.08, 0.15]
            orientation: ${eef_top_down_orientation}
            reference: object_world
            max_linear_step: 0.05
            max_angular_step: 0.2
            tolerance:
              position: 0.025
              orientation: 0.25
        eef:
          close: false
        post_move:
          - position: [0.0, 0.08, 0.15]
            orientation: ${eef_top_down_orientation}
            reference: object_world
            max_linear_step: 0.05
            max_angular_step: 0.25

task_operators:
  arm:
    initial_state:
      base_pose:
        position: [0.90, 0.05, 0.20]
        orientation: [0.0, 0.0, -1, 0]
    control:
      timeout_steps: 320
      cartesian_max_linear_step: 0.025
      cartesian_max_angular_step: 0.3
      tolerance:
        position: 0.008
        orientation: 0.10
        eef: 0.001
    max_joint_delta: 0.35
    ik:
      joint_control_mode: per_step_ik
