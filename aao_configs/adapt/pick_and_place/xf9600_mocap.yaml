# @package _global_
pick_place:
  # XF9600's 4-bar linkage makes the fingertips swing down in an arc as they
  # close (not parallel). Hold the eef clearly above the block so the pads
  # land on the block sides during the close, not on the table.
  pick_z: 0.045
  place_approach_z: 0.15
  # XF9600 pads grip the block near its top, so the eef sits ~0.04 m above
  # the block center. To land the block on the pedestal (top at z=0.14, block
  # half-height 0.018) we need eef ≈ pedestal.z + 0.10 (block center at 0.16,
  # eef ≈ 0.20).
  place_z: 0.10
  retreat_z: 0.18
