# @package _global_
#
# Zero-gravity reset randomization for task=microwave_sweet_potato:
#
#     aao-demo task=microwave_sweet_potato randomization=microwave_sweet_potato/zero_gravity
#
# The tuber floats in front of the open cavity in a random attitude,
# wherever the front camera sees it, not only over the counter.  The grasp
# is randomized relative to the tuber: the jaws close at any roll about its
# long axis (from level to upright in the world), tilted 0-20 deg off that
# axis, and up to 2 cm further back.  The tuber is placed with its long axis
# level, side by side or one above the other, whichever fits nearest.
defaults:
  - /randomization/microwave_sweet_potato/_microwave
  - /randomization/microwave_sweet_potato/_cameras
  - _self_

env:
  gravity: [0.0, 0.0, 0.0]

microwave_sweet_potato:
  # Pick in the static grasp frame randomized below, with the gripper's whole
  # orientation fixed in it: the frame carries the jaw roll and the tilt.
  grasp_site: sweet_potato_grasp_frame
  pick_orientation: level
  # Line up on the long axis behind the tuber and close with the EEF on it.
  approach_height: 0.0
  grasp_height: 0.0
  # Close up to 2 cm further back toward the blunt end.
  grasp_randomization:
    y: [-0.02, 0.0]
  # Place with the long axis level at the heading and jaw posture nearest to
  # how the tuber arrives, checked for clearance along the insertion.
  place_orientation: nearest
  place_entry: held
  # Release clear of the dish: a spun tuber reaches lower than the settled one.
  release_height: 0.015

task_operators:
  arm:
    control:
      grasp:
        # A released tuber keeps its velocity, so hold the arm 0.5 s at the
        # release pose first; nothing settles after opening.
        pre_release_settle_steps: 15
        release_settle_steps: 0

task:
  randomization:
    entities:
      # Home pose follows the tuber's position only: it always starts above
      # and behind the tuber, without orbiting its long axis or copying its
      # spin.
      arm:
        eef:
          reference: sweet_potato
          follow: position
          x: [-0.06, 0.06]
          y: [-0.04, 0.05]
          z: [-0.02, 0.08]
          # Start roll about the approach axis; the grasp frames below set
          # the roll the jaws close at.
          roll: [-0.785, 0.785]
          pitch: [-0.12, 0.12]
          yaw: [-0.2, 0.2]
          collision_radius: 0.15
      # Floats anywhere in front of the cavity that the front camera sees,
      # also beyond the counter's edges, with any spin about its long axis
      # plus a random heading and elevation.  The box only keeps it clear of
      # the counter top, the cabinet and the opened door; visible_in trims it
      # to the camera view.
      sweet_potato:
        proposal:
          reference: microwave
          x: [-0.25, 0.45]
          y: [-0.20, 0.05]
          z: [0.10, 0.40]
          roll: [-3.14159, 3.14159]
          pitch: [-0.35, 0.35]
          yaw: [-0.52, 0.52]
        constraints:
          visible_in:
            # Fixed cameras only: the home pose follows the tuber and is
            # sampled after it, so the wrist camera is not final yet.
            cameras: [env1_cam]
            geometry: bounding_sphere
            margin_px: 8
      # Jaw roll: the roll frame follows the tuber's full pose, then its roll
      # -- the turn about its own x, the tuber's long axis -- is set to an
      # absolute value, so the jaws close at any angle from level to
      # upright whatever the tuber's spin.  The place goal then turns them at
      # most about 15 deg to the nearer of its two postures when that one
      # fits.  The spin is uniform, so the jaw roll relative to the tuber
      # covers the full circle.
      sweet_potato_grasp_roll_frame:
        reference: sweet_potato
        roll:
          range: [-1.5708, 1.5708]
          reference: absolute_world
        collision_radius: 0.0
      # Tilt relative to the tuber: the grasp frame follows the roll frame and
      # tilts 0-20 deg nose-down about its own x, which is now the jaw axis,
      # through the jaw contact.  Nose-down keeps the gripper clear of the
      # cavity ceiling once the tuber is levelled for insertion (nose-up
      # clips it from about 7 deg); beyond about 20 deg the grasp slips while
      # the tuber is turned into the cavity.
      sweet_potato_grasp_frame:
        reference: sweet_potato_grasp_roll_frame
        roll: [-0.349, 0.0]
        collision_radius: 0.0
