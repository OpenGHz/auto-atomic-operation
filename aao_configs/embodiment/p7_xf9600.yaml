# @package _global_
#
# P7 arm + XF9600 gripper.
defaults:
  - _p7
  - _self_

env:
  scene:
    layers:
      robot:
        kind: mjcf
        path: ${assets_dir}/xmls/robots/p7_arm_with_xf9600.xml
        role: operator
  # 9 XF9600 linkage joints (near-zero rest values) on top of the P7 home.
  initial_joint_positions:
    # XF9600 parallel-linkage gripper (1 slide + 8 hinges, rest values)
    eef_clawj:  0.00014663
    eef_l11j:  -0.026352
    eef_l61j:  -0.0498527
    eef_l21j:   0.00981475
    eef_l23j:  -0.0176664
    eef_l31j:   0.0111485
    eef_l41j:  -0.0117531
    eef_l51j:  -0.013083
    eef_l53j:   0.0108253
  operators:
    arm:
      ik_factory: auto_atom.backend.mjc.ik.p7_analytical_ik_solver.P7AnalyticalIKSolver

backend: auto_atom.backend.mjc.ik.p7_analytical_ik_solver.build_p7_xf9600_backend
