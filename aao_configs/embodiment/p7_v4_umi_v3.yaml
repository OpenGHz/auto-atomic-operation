# @package _global_
#
# P7 arm v4 + UMI gripper v3. The V4 MJCF keeps the V3 analytical-IK
# interface; only the arm link dimensions and limits differ, so the V4 values
# are supplied at the IK binding instead of duplicating a second backend.
defaults:
  - p7_v3_umi_v3
  - _self_

env:
  scene:
    layers:
      robot:
        path: ${assets_dir}/xmls/robots/p7_arm_v4_with_umi_gripper_v3.xml
  operators:
    arm:
      ik_params:
        kinematics:
          # The V4 arm keeps the V3 DH angular convention.  Its shoulder
          # offset and upper-arm spacing are the geometry changes in the V4
          # asset; all other DH entries inherit the solver defaults.
          d: [0.0, 0.0662, 0.0, 0.249, 0.0, 0.32905, 0.0, 0.0, 0.0]
          joint_limits:
            - [-2.9669, 2.9669]
            - [-2.8798, 0.83775]
            - [-2.9669, 2.9669]
            - [-2.5307, 0.08726]
            - [-2.9669, 2.9669]
            - [-0.78539, 0.78539]
            - [-1.5708, 1.2217]
