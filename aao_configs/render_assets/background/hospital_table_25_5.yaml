# @package env.gaussian_render
#
# Background pose transform: [x, y, z] (pure translation) or
# [x, y, z, qx, qy, qz, qw] (full rigid-body transform). Initial offsets were
# estimated by aligning the densest near-horizontal plane around the
# background's likely tabletop height to the repo's common GS tabletop
# reference (table center ~= [0.45, 0.06], table top z ~= 0.0742). They may
# still need small per-scene refinement with the replay/compare tools.
background_ply: ${assets_dir}/gs/backgrounds/hospital_table_25_5.ply
background_transforms:
  hospital_table_25_5: [0.5158, -0.6083, 0.0755] # the bg itself looks not so good
