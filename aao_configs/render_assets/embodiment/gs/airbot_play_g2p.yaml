# @package env.gaussian_render
#
# Airbot Play arm + G2P gripper per-body GS assets.
defaults:
  - gs/_airbot_play
  - _self_

body_gaussians:
  eef_umi_base_link: ${assets_dir}/gs/robots/airbot_g2p/umi_base_link.ply
  eef_umi_claw: ${assets_dir}/gs/robots/airbot_g2p/umi_claw.ply
  eef_umi_l11: ${assets_dir}/gs/robots/airbot_g2p/umi_l11.ply
  eef_umi_l12: ${assets_dir}/gs/robots/airbot_g2p/umi_l12.ply
  eef_umi_l21: ${assets_dir}/gs/robots/airbot_g2p/umi_l21.ply
  eef_umi_l22: ${assets_dir}/gs/robots/airbot_g2p/umi_l22.ply
  eef_umi_l23: ${assets_dir}/gs/robots/airbot_g2p/umi_l23.ply
  eef_umi_l31: ${assets_dir}/gs/robots/airbot_g2p/umi_l31.ply
  eef_umi_l32: ${assets_dir}/gs/robots/airbot_g2p/umi_l32.ply
  eef_umi_l41: ${assets_dir}/gs/robots/airbot_g2p/umi_l41.ply
  eef_umi_l42: ${assets_dir}/gs/robots/airbot_g2p/umi_l42.ply
  eef_umi_l51: ${assets_dir}/gs/robots/airbot_g2p/umi_l51.ply
  eef_umi_l52: ${assets_dir}/gs/robots/airbot_g2p/umi_l52.ply
  eef_umi_l53: ${assets_dir}/gs/robots/airbot_g2p/umi_l53.ply
  eef_umi_l61: ${assets_dir}/gs/robots/airbot_g2p/umi_l61.ply
  eef_umi_l62: ${assets_dir}/gs/robots/airbot_g2p/umi_l62.ply
  eef_left_tactile: ${assets_dir}/gs/robots/airbot_g2p/umi_left_tactile.ply
  eef_right_tactile: ${assets_dir}/gs/robots/airbot_g2p/umi_right_tactile.ply
  # eef_left_cam: ${assets_dir}/gs/robots/airbot_g2p/umi_left_cam.ply
  # eef_right_cam: ${assets_dir}/gs/robots/airbot_g2p/umi_right_cam.ply
# Tactile PLYs are authored in the parent body's (umi_l23/umi_l53) local
# frame, but bound to right_tactile/left_tactile bodies which sit at a
# rigid offset inside their parent. Bake the inverse offset at load time
# so the runtime body pose puts them back where the visual mesh sits.
body_transforms:
  eef_right_tactile:
    position: [ 0.0, -0.0165, -0.0095 ]
    orientation: [ -0.5, 0.5, -0.5, 0.5 ] # xyzw, conjugate of body quat
  eef_left_tactile:
    position: [ 0.0, -0.0165, -0.0095 ]
    orientation: [ 0.5, -0.5, -0.5, 0.5 ] # xyzw, conjugate of body quat
