defaults:
  - basis_xf9600
  - _self_

env:
  enabled_sensors:
    - camera
    - pose
    - joint_position
    - joint_velocity
    - joint_effort
  scene:
    layers:
      - kind: mjcf
        path: ${assets_dir}/xmls/robots/airbot_play_with_g2.xml
  operators:
    arm:
      arm_actuators:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
      eef_actuators: [eef_g2_driver]
      eef_output_name: gripper
      eef_mapper:
        _target_: auto_atom.mappers.finger_distance.FingerDistanceMapper
        left_pad_geom: eef_left_finger_pad
        right_pad_geom: eef_right_finger_pad
        actuator_name: eef_g2_driver
      pose_site: eef_pose
      root_body: arm_base
      ik_factory: auto_atom.backend.mjc.ik.airbot_kdl_ik_solver.AirbotKdlIKSolver
      ik_params:
        arm_base_body: arm_base
        tcp_site_name: eef_pose
        arm_type: play_short
        eef_type: G2

backend: auto_atom.backend.mjc.ik.airbot_kdl_ik_solver.build_airbot_play_xf9600_backend
