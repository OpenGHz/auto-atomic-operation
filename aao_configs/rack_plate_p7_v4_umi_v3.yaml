defaults:
  - basis_p7_v3_umi_v3
  - _self_

scene_name: rack_plate
task_name: rack_plate_p7_v4_umi_v3

# The P7 V4 MJCF keeps the V3 analytical-IK interface.  Only the arm link
# dimensions and limits differ, so the V4 values are supplied at the binding
# seam instead of duplicating a second backend.
operator_robot_xml: ${assets_dir}/xmls/robots/p7_arm_v4_with_umi_gripper_v3.xml

env:
  batch_size: 1
  sim_freq: 1200
  update_freq: 30
  initial_joint_positions: null
  scene:
    base: ${assets_dir}/xmls/scenes/rack_plate/demo.xml
    layers:
      - kind: mjcf
        path: ${operator_robot_xml}
        role: operator
  cameras:
    # One static environment camera; the wrist camera remains robot-mounted.
    - name: eef_wrist_cam
      role: operator
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      parent_frame: eef_pose
      is_static: false
      rgb_clip_range_m: [0.001, 50.0]
      depth_clip_range_m: [0.001, 5.0]
    - name: rack_camera_front
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      is_static: true
  mask_objects: [object, rack_target]
  operations: [pick, place]
  viewer:
    lookat: [-0.12, 0.0, 0.12]
    distance: 0.75
    azimuth: 135
    elevation: -25
    step_delay: 0.02
    hold_seconds: 1.0
  operators:
    arm:
      ik_params:
        kinematics:
          d: [0.0, 0.0662, 0.0, 0.249, 0.0, 0.32905, 0.0, 0.0, 0.0]
          joint_limits:
            - [-2.9669, 2.9669]
            - [-2.8798, 0.83775]
            - [-2.9669, 2.9669]
            - [-2.5307, 0.08726]
            - [-2.9669, 2.9669]
            - [-0.78539, 0.78539]
            - [-1.5708, 1.2217]

task:
  seed: 7
  randomization:
    entities:
      # The base config ships a wide home-EEF range.  This task is placed to
      # reach both the source stand (x=-0.40) and the rack (x=-0.126), so the
      # arm is deliberately left at its home pose for now.
      arm: null
      # `object_only` transports the plate kinematically, so its source pose is
      # free scene state rather than a physical resting pose: the plate is
      # sampled as a floating world-frame box in front of the rack view instead
      # of being leaned back into the four-post stand, which is scenery here.
      # The whole disc must stay in `rack_camera_front` with an 8 px margin
      # (`visible_in`), measured against the plate's conservative support sphere
      # -- that camera, not the stand, is what bounds the box below.  The three
      # orientation axes are free, so the plate may arrive at any attitude.
      object:
        proposal:
          reference: absolute_world
          x: [-0.430, -0.250]
          y: [-0.100, 0.100]
          z: [0.130, 0.280]
          roll: [-3.14159, 3.14159]
          pitch: [-3.14159, 3.14159]
          yaw: [-3.14159, 3.14159]
          collision_radius: 0.088
        constraints:
          visible_in:
            cameras: [rack_camera_front]
            geometry: bounding_sphere
            margin_px: 8
      # The place target is the settled centre of the rack's first slot.  The
      # two bounding ribs leave a ~32 mm opening and the plate is inserted
      # edge-on (~4 mm thick), so the sampled centre can move a few millimetres
      # without the released plate reaching a rib.
      rack_target:
        x: [-0.006, 0.006]
        collision_radius: 0.03
    cameras:
      # Static rack view: plain world-frame viewpoint jitter.
      rack_camera_front:
        x: [-0.015, 0.015]
        y: [-0.015, 0.015]
        z: [-0.010, 0.010]
        roll: [-0.02, 0.02]
        pitch: [-0.02, 0.02]
        yaw: [-0.02, 0.02]
      # Wrist camera: the sampled world pose is stored as a parent-local
      # extrinsic, so this varies the camera's mounting offset on the wrist.
      # It is dropped together with the operator under `execution.mode:
      # object_only`.
      eef_wrist_cam:
        roll: [-0.015, 0.015]
        pitch: [-0.015, 0.015]
        yaw: [-0.015, 0.015]
  stages:
    - name: pick_plate
      object: object
      site: object_site
      operation: pick
      operator: arm
      param:
        pre_move:
          # The plate starts leaned in the four-post stand.  Both approach
          # poses use the plate frame, so the translation follows the actual
          # object pose instead of assuming a world-aligned disk.
          - position: [0.0, -0.025, 0.17]
            reference: object
            static: true
            orientation_goal:
              kind: axis_alignment
              # The UMI jaws close along EEF +Y.  The plate mesh normal is
              # object +X; the jaws therefore face it in the opposite sense.
              controlled_axis: [0.0, 1.0, 0.0]
              target_axis:
                vector: [1.0, 0.0, 0.0]
                reference: object
              direction: opposite
            max_linear_step: 0.02
            max_angular_step: 0.20
          - position: [0.0, -0.025, 0.0]
            reference: object
            static: true
            orientation_goal:
              kind: axis_alignment
              controlled_axis: [0.0, 1.0, 0.0]
              target_axis:
                vector: [1.0, 0.0, 0.0]
                reference: object
              direction: opposite
            max_linear_step: 0.01
            max_angular_step: 0.10
        eef:
          close: true
        post_move:
          - position: [0.0, 0.0, 0.15]
            reference: eef_world
            max_linear_step: 0.02
            max_angular_step: 0.15

    - name: place_plate
      object: rack_target
      site: rack_target_site
      operation: place
      operator: arm
      param:
        pre_move:
          # Lift first so the plate clears the stand and rack rim.
          - position: [0.0, 0.0, 0.12]
            reference: eef_world
            max_linear_step: 0.02
            max_angular_step: 0.15
          # Move above the slot before lowering.  This waypoint is expressed
          # in the rack target frame, so the object remains the controlled
          # frame while the EEF-to-plate grasp transform is measured at run
          # time.
          - controlled_frame:
              kind: held_object
              frame: object_site
            position: [0.0, 0.0, 0.18]
            reference: object
            static: true
            orientation_goal:
              kind: axis_alignment
              controlled_axis: [1.0, 0.0, 0.0]
              target_axis:
                vector: [1.0, 0.0, 0.0]
                reference: world
              direction: same
            tolerance:
              position: 0.012
              orientation: 0.10
          # The target frame is the settled centre of the first rack slot.  The
          # smaller plate is released 17 mm above that centre so it can fall
          # onto the rack floor without driving the gripper into the ribs.
          # The migrated plate's local +X is its physical normal after the
          # authored mesh rotation, so constrain that axis to the slot normal
          # while leaving the in-plane twist unconstrained.
          - controlled_frame:
              kind: held_object
              frame: object_site
            position: [0.0, 0.0, 0.017]
            reference: object
            static: true
            orientation_goal:
              kind: axis_alignment
              controlled_axis: [1.0, 0.0, 0.0]
              target_axis:
                vector: [1.0, 0.0, 0.0]
                reference: world
              direction: same
            tolerance:
              position: 0.015
              orientation: 0.10
        eef:
          close: false
        placed_reference: pre_move
        placed_tolerance:
          position: 0.025
          orientation: 0.10

task_operators:
  arm:
    initial_state:
      # Mount the V4 arm midway between the source stand (x=-0.4) and rack
      # (x≈0), with its +X axis pointing from the front of the table toward the
      # work area.  The EEF home below is expressed in this rotated base frame.
      base_pose:
        position: [-0.20, -0.5, 0.075]
        # XYZW quaternion: +90° about world Z, so base +X points toward +Y.
        orientation: [0.0, 0.0, 0.70710678, 0.70710678]
      eef_pose:
        # Same world pose as before, represented relative to the rotated base:
        # R_base^T * (p_world - p_base) = [0.605, 0, 0.055165074].
        position: [0.605, 0.0, 0.055165074]
        orientation: [0.0, 0.0, 0.0, 1.0]
        reference: base
      eef: 0.0
    control:
      timeout_steps: 900
      cartesian_max_linear_step: 0.02
      cartesian_max_angular_step: 0.20
      tolerance:
        position: 0.012
        orientation: 0.10
        eef: 0.002
        placed:
          position: 0.02
          orientation: 0.10
    ik:
      joint_control_mode: per_step_ik
      max_joint_delta: 0.25
