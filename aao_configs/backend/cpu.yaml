# @package _global_
#
# CPU MuJoCo -- the default backend:
#
#     aao-demo task=<task> backend=cpu
#
# This option is intentionally empty.  Each embodiment sets its own
# robot-specific CPU builder (for example `build_p7_v3_umi_v3_backend`) and
# the simulator group sets `env._target_`; this baseline must not clobber
# those.  See `warp.yaml` for the GPU counterpart.
