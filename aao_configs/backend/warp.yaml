# @package _global_
#
# GPU (mujoco_warp) backend.  Select it from the command line without editing
# any task config:
#
#     aao-demo --config-name <task> +backend=warp
#
# The leading `+` is required: this group is deliberately not listed in any
# config's `defaults`, so there is no entry to override -- `+` appends one.
# That is also what makes it win.  Every robot basis config re-asserts its own
# CPU builder in its `_self_`, which composes after an inherited defaults entry
# and would overwrite the group; an appended group composes last, so it wins on
# any task config regardless of how deep its inheritance chain is.  A plain
# `backend=warp` fails with "Could not override 'backend'".
#
# No `@_global_` is needed on the command line: the `# @package _global_`
# header above already places this file's content at the config root.
#
# Physical execution supports mocap operators and joint-mode `per_step_ik`.
# `solve_once_interpolate` (e.g. cup_on_coaster_airbot_p7_umi) is not implemented.
# Object-only execution is also available with `execution.mode=object_only`.
# The Warp env has no interactive viewer path.
#
# MJWarp disables `noslip_iterations` on its compiled model with a warning;
# grasped objects may creep under load. Shared MJCF and CPU physics retain it.
#
# `njmax` is the constraint budget per world. 2048 provides headroom over the
# previous 512 default; contact-heavy scenes may still need `env.njmax=<n>`.
# Insufficient capacity raises `njmax overflow` at construction or reports
# `nefc overflow` during stepping. Memory cost scales with the world count.
# `nconmax` reserves candidate contacts per world; complex gripper meshes need
# more than MJWarp's small automatic estimate. Both capacities can be overridden.
env:
  _target_: auto_atom.basis.mjwarp.env.MjWarpObjectOnlyEnv
  njmax: 2048
  nconmax: 1024
  viewer: null
backend: auto_atom.backend.mjwarp.backend.build_mjwarp_backend
