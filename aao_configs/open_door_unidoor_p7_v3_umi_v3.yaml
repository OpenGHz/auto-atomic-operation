defaults:
  - open_door_p7_v3_umi_v3
  - _self_

scene_name: open_door_unidoor
task_name: open_door_unidoor_p7_v3_umi_v3
door_id: D001
handle_id: H001

env:
  scene:
    base: ${assets_dir}/xmls/scenes/open_door_unidoor/demo.xml
    layers:
      - kind: asset_assembly
        package: ${oc.env:AAO_UNIDOOR_ASSET_PACKAGE,assets/scene_assets/unidoor_lever_right_hinge/scene_asset_package.json}
        adapter: unidoor.lever_door@1
        selection:
          door: ${door_id}
          handle: ${handle_id}
        namespace: door
        # Flip the door around its panel centre (rather than its hinge origin)
        # so the handle and P7 are on the same side while the panel footprint
        # stays in the existing camera/interaction region.
        placement:
          position: [1.54, 0.13939759036, -1.0]
          orientation_xyzw: [0.0, 0.0, -0.707106781, 0.707106781]
        verify_hashes: true
      - kind: mjcf
        path: ${assets_dir}/xmls/robots/p7_arm_v3_with_umi_gripper_v3.xml
        role: operator
  mask_objects: [door__door_handle]
  # Heat-map focus for the manipulated mask object; task.stages below is the
  # authoritative PICK -> PULL -> PUSH workflow.
  operations: [push]
  pre_step_callbacks:
    - _target_: auto_atom.callbacks.door_latch.DoorLatchCallback
      config:
        _target_: auto_atom.callbacks.door_latch.DoorLatchConfig
        lock_constraint: door__door_latch_lock
        door_joint: door__door_hinge
        handle_joint: door__handle_hinge
        handle_direction: 1
        unlock_travel: 0.12
        relock_travel: 0.08
        relock_zone: 0.02

task:
  stages:
    - name: pick_handle
      object: door__door_handle
      site: door__handle_grasp_center
      operation: pick
      operator: arm
      param:
        pre_move:
          - position: [-0.14, 0.0, 0.0]
            reference: object_world
            orientation: [0.68997457, 0.19902274, -0.20541703, 0.66492774]
            max_linear_step: 0.04
            max_angular_step: 0.25
          # Advance 2 cm through the catalog grasp centre.  This is the
          # deepest tested offset that still establishes two-finger contact;
          # 2.5 cm loses the left finger on D001/H003.
          - position: [0.02, 0.0, 0.0]
            reference: object_world
            orientation: [0.68997457, 0.19902274, -0.20541703, 0.66492774]
            max_linear_step: 0.04
            max_angular_step: 0.2
            tolerance:
              # Catalog-wide controller residuals normally settle below
              # 3.5 mm.  Keep this stricter than the 8 mm operator default,
              # then let PICK's target-specific grasp check decide success.
              position: 0.004

    - name: pull_handle
      object: door__door_handle
      operation: pull
      operator: arm
      param:
        # PULL intrinsically verifies the Stage target grasp before rotation and
        # checks that the same target remains grasped after the effect trajectory.
        post_move:
          - arc:
              pivot: door__handle_hinge
              axis: [1, 0, 0]
              # The UniDoor latch releases at 0.12 rad.  Keep a small margin
              # without asking the P7 to follow the unreachable 0.45-rad arc.
              angle: 0.15
              absolute: true
              max_step: 0.03
            reference: world

    - name: push_open
      object: door__door_handle
      operation: push
      operator: arm
      param:
        # PULL has already rotated the handle and verified the retained grasp.
        # PUSH has no EEF boundary; pre_move is the door-opening trajectory.
        pre_move:
          - arc:
              pivot: door__door_hinge
              axis: [0, 0, -1]
              angle: 0.20
              absolute: true
              max_step: 0.01
            reference: world

task_operators:
  arm:
    initial_state:
      base_pose:
        # Keep the robot base at a stable offset from the selected handle.
        # The offset reproduces the existing D001/H001 world placement while
        # allowing every catalog handle to bring the arm to the same relative
        # interaction pose.
        reference: door__handle_grasp_center
        position: [0.2474, -0.4666, -0.1]
        orientation: [0.0, 0.0, 0.70710678, 0.70710678]
    control:
      tolerance:
        # The UMI v3 closing span is only 0.0165.  The inherited 0.012
        # tolerance allowed close to finish before either finger made contact.
        eef: 0.002
