# @package _global_
defaults:
  - override /scene: microwave_sweet_potato
  - override /embodiment: umi_v3_mocap
  - _self_

task_name: microwave_sweet_potato_umi_v3

# Named parameters that randomization/microwave_sweet_potato/* presets retune
# instead of restating the stages.
microwave_sweet_potato:
  # Frame the pick waypoints are written in.  sweet_potato_grasp_site sits on
  # the tuber; a preset can switch to the static sweet_potato_grasp_frame and
  # randomize that frame relative to the tuber.
  grasp_site: sweet_potato_grasp_site
  # Pick orientation goal, written in grasp_site: a key of the map below.
  pick_orientation: level
  pick_orientation_goals:
    # EEF +X (approach) along the long axis and the jaws level.
    level:
      kind: fixed
      quaternion_xyzw: [0.0, 0.0, 0.70710678, 0.70710678]
    # Only the approach axis (EEF +X) is fixed, along the long axis; the jaws
    # keep the gripper's own roll about it.
    approach_axis:
      kind: axis_alignment
      controlled_axis: [1.0, 0.0, 0.0]
      target_axis:
        vector: [0.0, 1.0, 0.0]
        reference: object
      direction: same
  # EEF height (m) above the grasp site while lining up behind the tuber and
  # when the jaws close.
  approach_height: 0.06
  grasp_height: 0.0093
  # Optional per-waypoint randomization of the closing position, or null.
  grasp_randomization: null
  # Height (m) above the settled pose on the dish where the jaws open.
  release_height: 0.006
  # Held-tuber orientation goal inside the cavity: a key of the map below.
  place_orientation: settled
  place_orientation_goals:
    # The settled counter pose turned into the cavity (long axis along the
    # target +X with its ~31 deg resting roll), so the tuber is released at
    # rest.  Under gravity a roll-free goal lets the compliant weld's roll sag
    # accumulate until the released tuber tips over on the dish.
    settled:
      kind: fixed
      quaternion_xyzw: [-0.26070, -0.02019, -0.00087, 0.96521]
    # Only the long axis points into the cavity; roll about it stays free.
    axis:
      kind: axis_alignment
      controlled_axis: [1.0, 0.0, 0.0]
      target_axis:
        vector: [1.0, 0.0, 0.0]
        reference: object
      direction: same

env:
  batch_size: 1
  # The gripper starts level behind the sweet potato: its +X approach axis
  # points along world +Y (into the microwave), so the jaws close along world
  # X and the 56 mm-thick jaw plane stays horizontal for the oven cavity.
  # freejoint: pos(xyz) + quat(wxyz), +90 deg about world Z.
  initial_joint_positions:
    umi_freejoint: [0.20, -0.57, 0.20, 0.70710678, 0.0, 0.0, 0.70710678]
  mask_objects: [sweet_potato, microwave_target]
  operations: [pick, place]
  viewer:
    # Front-right view into the open cavity (looking toward +Y, -X).
    lookat: [0.06, -0.02, 0.14]
    distance: 0.95
    azimuth: 120
    elevation: -28
    step_delay: 0.03
    hold_seconds: 1.0

task_operators:
  arm:
    control:
      # The transfer carries a 0.2 kg tuber 0.4 m and threads it into a 0.1 m
      # tall cavity, so allow a longer horizon.  Cartesian step clamping is
      # deliberately not used: each clamped step is re-based on the measured
      # EEF, so the soft mocap weld's steady sag accumulates into a downward
      # drift on long lateral moves.
      timeout_steps: 300
      tolerance:
        # The compliant mocap weld lags the target while it carries the
        # tuber; match the pick_and_place umi_v3_mocap allowance.
        position: 0.015
        orientation: 0.10
      grasp:
        # Wait one second (30 Hz) after opening so placement is judged on a
        # settled tuber rather than the release instant.
        release_settle_steps: 30

task:
  randomization:
    entities:
      # Keep the home pose clear of the counter and cavity: small jitter only.
      arm:
        eef:
          x: [-0.05, 0.05]
          y: [-0.04, 0.04]
          z: [-0.02, 0.04]
          collision_radius: 0.15
      # Slide the tuber on the counter.  The presets under
      # randomization/microwave_sweet_potato/ widen this considerably; the
      # proposal/constraints form lets a preset add constraints.
      sweet_potato:
        proposal:
          x: [-0.03, 0.03]
          y: [-0.03, 0.03]
          collision_radius: 0.085
  stages:
    - name: pick_sweet_potato
      object: sweet_potato
      # Jaw contact on the 45 mm section 40 mm behind the tuber centre.  It is
      # world-aligned in the settled pose (+Y = long axis toward the
      # microwave, +Z up), so the waypoints follow the tuber's pose.
      site: ${microwave_sweet_potato.grasp_site}
      operation: pick
      operator: arm
      param:
        pre_move:
          # The jaw contact band sits 4-16 mm below the gripper mid-plane and
          # the pads meet the section about 24 mm behind eef_pose, so the EEF
          # closes 24.1 mm ahead of and grasp_height above the grasp site.
          - position: [0.0, -0.12, "${microwave_sweet_potato.approach_height}"]
            orientation_goal: ${microwave_sweet_potato.pick_orientation_goals.${microwave_sweet_potato.pick_orientation}}
            reference: object
          # Drop to grasp height behind the tuber, then slide the open jaws
          # (100 mm gap) forward around it.
          - position: [0.0, -0.12, "${microwave_sweet_potato.grasp_height}"]
            orientation_goal: ${microwave_sweet_potato.pick_orientation_goals.${microwave_sweet_potato.pick_orientation}}
            reference: object
          - position: [0.0, 0.0241, "${microwave_sweet_potato.grasp_height}"]
            orientation_goal: ${microwave_sweet_potato.pick_orientation_goals.${microwave_sweet_potato.pick_orientation}}
            reference: object
            randomization: ${microwave_sweet_potato.grasp_randomization}
        eef:
          close: true
        post_move:
          # Lift clear of the counter to the cavity insertion height.
          - position: [0.0, 0.0, 0.11]
            reference: eef_world

    - name: place_sweet_potato_in_microwave
      object: microwave_target
      site: microwave_target_site
      operation: place
      operator: arm
      param:
        pre_move:
          # 0) Square the gripper up 0.36 m in front of the cavity: turn its jaw
          #    axis (EEF +Y) horizontal and square to the cavity axis, keeping
          #    any tilt about that axis.  The cavity fits only about 10 deg of
          #    jaw roll, and the tuber's long axis then lies in the vertical
          #    plane of the cavity axis.
          - position: [-0.36, 0.0, 0.04]
            orientation_goal:
              kind: axis_alignment
              controlled_axis: [0.0, 1.0, 0.0]
              target_axis:
                vector: [0.0, 1.0, 0.0]
                reference: object
              direction: same
            reference: object
            static: true
          # The remaining goals move the held tuber, expressed in the
          # turntable target frame (local +X points at the back wall).
          # 1) Line up 0.30 m in front of the target, 22 mm above its resting
          #    height so the tuber clears the turntable's raised rim.
          - controlled_frame:
              kind: held_object
              frame: sweet_potato_site
            position: [-0.30, 0.0, 0.022]
            orientation_goal: ${microwave_sweet_potato.place_orientation_goals.${microwave_sweet_potato.place_orientation}}
            reference: object
            static: true
            tolerance:
              position: 0.02
              orientation: 0.15
          # 2) Slide straight in over the turntable.
          - controlled_frame:
              kind: held_object
              frame: sweet_potato_site
            position: [0.0, 0.0, 0.022]
            orientation_goal: ${microwave_sweet_potato.place_orientation_goals.${microwave_sweet_potato.place_orientation}}
            reference: object
            static: true
            tolerance:
              position: 0.02
              orientation: 0.15
          # 3) Lower to just above the settled pose and release there.
          - controlled_frame:
              kind: held_object
              frame: sweet_potato_site
            position: [0.0, 0.0, "${microwave_sweet_potato.release_height}"]
            orientation_goal: ${microwave_sweet_potato.place_orientation_goals.${microwave_sweet_potato.place_orientation}}
            reference: object
            static: true
            tolerance:
              position: 0.02
              orientation: 0.15
        eef:
          close: false
        post_move:
          # Back the open jaws straight out of the cavity.
          - position: [0.0, -0.25, 0.0]
            reference: eef_world
        placed_reference: pre_move
        placed_tolerance:
          position: 0.025
          orientation: 0.20
