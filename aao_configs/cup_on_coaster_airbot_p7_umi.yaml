defaults:
  - basis_p7_v3_umi_v3
  - _self_

scene_name: cup_on_coaster
task_name: airbot_p7_cup_on_coaster
model_name: demo_gs
max_updates: 650

env:
  cameras:
    - name: eef_wrist_cam
      role: operator
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      parent_frame: eef_pose
      is_static: false
    - name: env0_cam
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      is_static: true
    - name: env1_cam
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      is_static: true
  sim_freq: 1000
  update_freq: 50
  mask_objects: ["cup", "coaster"]
  operations: ["pick", "place"]
  viewer:
    lookat: [0.45, 0.05, 0.08]
    distance: 0.8
    azimuth: 135
    elevation: -28
    step_delay: 0.005
    hold_seconds: 0.5

task:
  randomization:
    cup:
      x: [-0.1, 0.0]
      y: [-0.3, 0.05]
      collision_radius: 0.04
      reference: arm.base
    coaster:
      x: [-0.1, 0.0]
      y: [-0.1, 0.25]
      collision_radius: 0.04
      reference: arm.base
    arm:
      base:
        x: [-0.15, 0.1]
        y: [-0.2, 0.08]
      # eef:
      #   x: [-0.03, 0.07]
      #   y: [-0.15, 0.20]
      #   z: [-0.005, 0.005]

  stages:
    - name: pick_cup
      object: cup
      operation: pick
      operator: arm
      param:
        pre_move:
          - position: [0.0, 0.0, 0.10]
            orientation: [0.70710678, 0.0, -0.70710678, 0.0]
            reference: object_world
          - position: [0.0, 0.0, 0.01]
            reference: object_world
            # max_linear_step: 0.04
            # max_angular_step: 0.2
        eef:
          close: true
        post_move:
          - position: [0.0, 0.0, 0.03]
            reference: eef_world
            max_linear_step: 0.02
            max_angular_step: 0.1

    - name: place_cup
      object: coaster
      operation: place
      operator: arm
      param:
        pre_move:
          - position: [0.0, 0.0, 0.09]
            reference: object_world
            max_linear_step: 0.05
            max_angular_step: 0.2
        eef:
          close: false
        post_move:
          - position: [0.0, 0.0, 0.02]
            reference: eef_world
            max_linear_step: 0.05
            max_angular_step: 0.25
        placed_tolerance:
          position: [0.1, 0.1, 0.1]
          orientation: [null, null, null]

task_operators:
  arm:
    initial_state:
      base_pose:
        position: [0.1, 0.0, 0.2]
        orientation: [0.0, 0.0, 0.0, 1.0]
      eef_pose:
        # Derived from a verified real-arm joint config:
        # j = [-2.13088, -0.54817, 2.66519, -0.33772, 0.46073, -0.22401, -0.59409]
        # FK in p7_mount frame, cross-checked by P7V3 analytical IK.
        position: [0.2785, 0.0, 0.0]
        orientation: [0.70710678, 0.0, -0.70710678, 0.0]
        reference: base
    control:
      timeout_steps: 220
      cartesian_max_linear_step: 0.025
      cartesian_max_angular_step: 0.3
      tolerance:
        position: 0.008
        orientation: 0.10
        eef: 0.001
    max_joint_delta: 0.35
    ik:
      joint_control_mode: solve_once_interpolate
      joint_interp_speed: 0.05
