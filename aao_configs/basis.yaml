defaults:
  - common_vars
  - compatible_vars
  - _self_

model_name: demo
task_name: ${scene_name}

env:
  _target_: auto_atom.basis.mjc.mujoco_env.BatchedUnifiedMujocoEnv
  name: ${task_name}
  model_path: ${assets_dir}/xmls/scenes/${scene_name}/${model_name}.xml
  # Optional list of robot XML paths injected as <include> siblings of
  # <mujoco> at load time. Leave empty when ``model_path`` already embeds its
  # own robot (legacy monolithic scenes). Set per task when the scene XML is
  # robot-less, e.g.:
  #   env:
  #     robot_paths:
  #       - ${assets_dir}/xmls/robots/robotiq.xml
  # robot_paths: []
  batch_size: 2
  enabled_sensors:
    - camera
    - pose
    - tactile
    - joint_position
    - joint_velocity
    - joint_effort
  sim_freq: 600
  update_freq: 30
  cameras:
    - name: wrist_cam
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      parent_frame: eef_pose
      is_static: false
    - name: env1_cam
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      is_static: true
    - name: env0_cam
      width: ${cam_width}
      height: ${cam_height}
      enable_color: ${enable_color}
      enable_depth: ${enable_depth}
      enable_mask: ${enable_mask}
      enable_heat_map: ${enable_heat_map}
      is_static: true
  # structured: true
  heatmap_operations: ["pick", "place", "push", "pull", "press"]

backend: auto_atom.backend.mjc.mujoco_backend.build_mujoco_backend

task:
  env_name: ${task_name}
  seed: 42
  # Optional reset-time fast-forward selector. Child configs can replace this
  # mapping to start rollout after a configured YAML waypoint.
  start_after: null
  # Independent full controller/physics replay target. Select either an
  # absolute task frame or a waypoint plus an optional frame offset. The target
  # is the visible start: its prefix is physically executed but hidden. From
  # there, presentation defaults to waypoint jumps until stop_at; set
  # presentation.preserve_arcs=true to animate arcs, or presentation.mode=full
  # to animate every visible controller tick. Physics is never skipped.
  physical_replay: null
  # Optional normal-success endpoint in the same absolute-frame or
  # waypoint-plus-offset coordinate system as physical_replay.
  stop_at: null
  randomization:
    arm:
      eef:
        x: [-0.3, 0.35]
        y: [-0.32, 0.10]
        z: [-0.0, 0.2]
        collision_radius: 0.15
  # camera_randomization:
  #   env0_cam:
  #     reference: absolute_world
  #     x: [0.8, 1.0]
  #     y: [-0.1, 0.1]
  #     z: [0.4, 0.6]
  #   env1_cam:
  #     x: [-0.05, 0.05]
  #     y: [-0.05, 0.05]
  #     pitch: [-0.1, 0.1]
task_operators:
  arm: {}
