# Single entry point for every runnable task.
#
#     aao-demo task=<task> [embodiment=<embodiment>] [render=gs] [backend=warp] ...
#
# Each entry below is one independent dimension. Later entries win over
# earlier ones, and command-line overrides win over everything. A task selects
# its scene and default embodiment through `override /<group>: ...` in its own
# defaults list, so `embodiment=...` on the command line still takes priority.
#
# Specialization slots (`optional ...: ${a}/${b}`) are resolved from the final
# group choices and are silently skipped when no matching file exists:
#   adapt/<task>/<embodiment>         task x embodiment tuning (waypoints, base pose)
#   render_assets/<axis>/<render>/... per-renderer assets (e.g. GS PLY bindings)
#
# Files and directories whose name starts with `_` are shared fragments that
# other options include through their defaults lists; never select them directly.
defaults:
  - _self_
  - simulator: mujoco
  - execution: physical
  - observation: default
  - camera_layout: all
  - scene: ???
  - embodiment: ???
  - task: pick_and_place
  - render: mujoco
  - optional render_assets/embodiment: ${render}/${embodiment}
  - optional render_assets/scene: ${render}/${scene}
  - optional render_assets/task: ${render}/${task}
  - optional adapt: ${task}/${embodiment}
  - backend: cpu
  - platform: null

assets_dir: assets
